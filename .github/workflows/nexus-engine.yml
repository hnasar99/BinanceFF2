name: NEXUS Engine

on:
  push:
    paths:
      - 'nexus-engine/**'
      - '.github/workflows/nexus-engine.yml'
  pull_request:
    paths:
      - 'nexus-engine/**'
      - '.github/workflows/nexus-engine.yml'

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexus-engine
      - name: Normalize formatting
        run: cargo fmt --all
      - name: Compile
        run: cargo check --all-targets
      - name: Unit tests
        run: cargo test --all-targets
